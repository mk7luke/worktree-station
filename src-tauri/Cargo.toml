[package]
name = "app"
version = "0.1.0"
description = "Worktree Station"
authors = ["Luke <pssluke@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
dirs = "6"
anyhow = "1"
parking_lot = "0.12"
log = "0.4"
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
